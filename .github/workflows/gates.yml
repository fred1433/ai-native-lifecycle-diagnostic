name: gates

# Every gate in the policy runs here, on every pull request, against the upstream platform
# fetched at the pinned commit. No model is called in this workflow: the analysis and the
# tickets were produced once, by an agent, and what runs from now on is arithmetic and tests.

on:
  # A label is an input to the gates, so applying or removing one has to run them again. Without
  # this, a human signature arrives after the verdict and the verdict never hears about it.
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  GOLDEN_FILTER: "FullyQualifiedName~Nop.Services.Tests.Orders|FullyQualifiedName~Nop.Services.Tests.Catalog|FullyQualifiedName~Nop.Services.Tests.Shipping|FullyQualifiedName~Nop.Services.Tests.Tax"

jobs:
  policy:
    name: policy
    runs-on: ubuntu-latest
    outputs:
      tickets: ${{ steps.discover.outputs.tickets }}
    steps:
      - uses: actions/checkout@v4

      - name: the classifier and the receipt verifier are themselves tested
        run: python3 -m unittest discover -s harness/policy_tests -v

      - name: every ticket carries a receipt that agrees with its own diff
        run: |
          shopt -s nullglob
          patches=(tickets/*/change.patch)
          echo "${#patches[@]} ticket(s) in this revision"
          for patch in "${patches[@]}"; do
            python3 scripts/verify_receipt.py "$(dirname "$patch")"
          done

      - name: added lines obey the rules that admit no baseline
        run: |
          shopt -s nullglob
          patches=(tickets/*/change.patch)
          if [ ${#patches[@]} -gt 0 ]; then
            python3 scripts/check_added_lines.py "${patches[@]}"
          else
            echo "no ticket in this revision"
          fi

      - name: verdicts
        run: |
          shopt -s nullglob
          {
            echo "## Autonomy verdicts, computed from the diffs"
            for patch in tickets/*/change.patch; do
              echo ""
              echo "### $(basename "$(dirname "$patch")")"
              echo '```'
              python3 scripts/classify_change.py "$patch"
              echo '```'
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - id: discover
        name: one job per ticket
        run: |
          list=$(python3 -c "import json,pathlib; print(json.dumps(sorted(str(p.parent) for p in pathlib.Path('tickets').glob('*/change.patch'))))" 2>/dev/null || echo "[]")
          echo "tickets=$list" >> "$GITHUB_OUTPUT"
          echo "$list"

  human_gates:
    name: human gates
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: a schema change needs a human signature, not a green build
        env:
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 scripts/check_human_gates.py --labels "$PR_LABELS" --changed-tickets-from-git "${{ github.event.pull_request.base.sha }}"

  boundaries_clean:
    name: boundaries on the untouched platform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"
      - name: fetch the upstream platform at the pinned commit
        run: bash scripts/fetch_upstream.sh
      - name: cache nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('harness/ArchitectureTests/ArchitectureTests.csproj', 'policy/work-classes.json') }}
      - name: the baseline is accurate at this commit
        run: dotnet test harness/ArchitectureTests/ArchitectureTests.csproj -c Release --logger "console;verbosity=normal"

  ticket:
    name: ticket
    needs: policy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ticket: ${{ fromJSON(needs.policy.outputs.tickets) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: fetch the upstream platform at the pinned commit
        run: bash scripts/fetch_upstream.sh

      - name: cache nuget
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('harness/ArchitectureTests/ArchitectureTests.csproj', 'policy/work-classes.json') }}

      - name: apply the tickets up to this one
        run: bash scripts/apply_tickets.sh "${{ matrix.ticket }}"

      - name: build
        run: dotnet build harness/ArchitectureTests/ArchitectureTests.csproj -c Release

      - name: boundaries
        run: dotnet test harness/ArchitectureTests/ArchitectureTests.csproj -c Release --no-build --logger "console;verbosity=normal"

      - name: behaviour, the flows where stock and money move
        run: dotnet test upstream/src/Tests/Nop.Tests/Nop.Tests.csproj -c Release --filter "$GOLDEN_FILTER" --logger "console;verbosity=normal"

  gates_ok:
    name: gates ok
    if: always()
    needs: [policy, human_gates, boundaries_clean, ticket]
    runs-on: ubuntu-latest
    steps:
      - name: every gate passed or had nothing to do
        run: |
          results=(
            "policy=${{ needs.policy.result }}"
            "human gates=${{ needs.human_gates.result }}"
            "boundaries=${{ needs.boundaries_clean.result }}"
            "tickets=${{ needs.ticket.result }}"
          )
          printf '%s\n' "${results[@]}"
          failed=0
          for entry in "${results[@]}"; do
            case "${entry#*=}" in
              success|skipped) ;;
              *) echo "::error::${entry%%=*} did not pass"; failed=1 ;;
            esac
          done
          exit $failed
